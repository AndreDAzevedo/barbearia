# Configuração HTTPS (principal)
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certificates/barbearia.crt;
    ssl_certificate_key /etc/nginx/certificates/barbearia.key;

    # Redirecionar páginas de política para HTTP
    location ~ ^/(politica-seguranca|politica-privacidade) {
        return 301 http://$host$request_uri;
    }

    # Todas as outras rotas vão para HTTPS
    location / {
        proxy_pass https://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Configuração HTTP (apenas para páginas de política)
server {
    listen 80;
    server_name localhost;

    # Apenas páginas de política
    location ~ ^/(politica-seguranca|politica-privacidade) {
        proxy_pass https://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
} 