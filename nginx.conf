# Configuração HTTPS (principal)
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certificates/barbearia.crt;
    ssl_certificate_key /etc/nginx/certificates/barbearia.key;

    # Configurações de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Redirecionar páginas de política para HTTP
    location ~ ^/(politica-seguranca|politica-privacidade) {
        return 301 http://$host:8080$request_uri;
    }

    # Todas as outras rotas vão para HTTPS
    location / {
        proxy_pass https://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Configurações adicionais do proxy
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Configuração HTTP (para páginas de política)
server {
    listen 8080;
    server_name localhost;

    # Páginas de política em HTTP
    location ~ ^/(politica-seguranca|politica-privacidade) {
        proxy_pass https://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
} 