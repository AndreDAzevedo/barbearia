{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário - {{ user_edit.username }}</title>
    <style>
        body {
            background-image: url("{% static 'images/background2.png' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #ffc107;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 5px #ffc107;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #218838;
        }

        a.voltar {
            color: #ffc107;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        a.voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editar Usuário - {{ user_edit.username }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn" type="submit">Salvar Alterações</button>
        </form>

        <a class="voltar" href="{% url 'area_gestor' %}">Voltar</a>
    </div>
</body>
</html>
