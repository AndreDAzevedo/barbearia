version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:8080"
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certificates:/etc/nginx/certificates
    networks:
      - barbearia-network

networks:
  barbearia-network:
    driver: bridge 